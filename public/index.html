<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅昌印制大奖</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --gold:#c9a227;
            --gold-light:#e8d48b;
            --bg-dark:#0a0a0f;
            --border-gold:rgba(201,162,39,0.3);
            --text-dim:rgba(255,255,255,0.45)
        }
        body{
            font-family:'Noto Serif SC','Playfair Display',serif;
            background:var(--bg-dark);
            color:#fff;
            min-height:100vh;
            overflow-x:hidden
        }
        
        .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(201,162,39,0.08) 0%,transparent 70%)}
        
        .header{
            position:fixed;top:0;left:0;right:0;z-index:100;
            padding:24px 60px;display:flex;justify-content:space-between;align-items:center;
            background:linear-gradient(to bottom,rgba(10,10,15,0.98),transparent)
        }
        .logo{display:flex;align-items:center;gap:14px}
        .logo-icon{
            width:44px;height:44px;
            background:linear-gradient(135deg,var(--gold),var(--gold-light));
            border-radius:10px;display:flex;align-items:center;justify-content:center;
            color:#0a0a0f;font-size:20px
        }
        .logo-text{font-size:18px;color:var(--gold);font-weight:600;letter-spacing:4px}
        
        .header-right{display:flex;align-items:center;gap:20px}
        .search-box{position:relative}
        .search-box input{
            width:240px;padding:10px 18px;padding-left:40px;
            border-radius:25px;border:1px solid var(--border-gold);
            background:rgba(255,255,255,0.03);color:#fff;font-size:13px
        }
        .search-box input:focus{outline:none;border-color:var(--gold)}
        .search-box input::placeholder{color:var(--text-dim)}
        .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gold);opacity:0.5}
        
        .admin-btn{
            padding:10px 20px;border-radius:20px;
            border:1px solid var(--border-gold);background:transparent;
            color:rgba(255,255,255,0.8);font-size:13px;cursor:pointer
        }
        .admin-btn:hover{background:var(--gold);color:#0a0a0f;border-color:var(--gold)}
        
        .main{
            max-width:1200px;margin:0 auto;
            padding:120px 40px 60px;
            display:flex;flex-direction:column;align-items:center
        }
        
        .stats{display:flex;gap:120px;margin-bottom:60px}
        .stat{text-align:center}
        .stat-value{
            font-family:'Playfair Display',serif;
            font-size:72px;font-weight:700;color:var(--gold);line-height:1
        }
        .stat-label{font-size:14px;color:var(--text-dim);margin-top:14px;letter-spacing:4px}
        
        .title{text-align:center;margin-bottom:60px}
        .title h1{
            font-family:'Noto Serif SC','Playfair Display',serif;
            font-size:48px;font-weight:600;letter-spacing:8px;margin-bottom:20px;
            background:linear-gradient(135deg,var(--gold),var(--gold-light));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            text-shadow:0 0 60px rgba(201,162,39,0.3)
        }
        .title-desc{font-size:15px;color:var(--text-dim);line-height:1.9;letter-spacing:1px;max-width:700px;margin:0 auto 30px;text-align:center}
        .highlight{color:var(--gold);font-weight:600}

        /* 环形布局 */
        .ring-container{
            position:relative;
            width:800px;height:800px;
            margin:0 auto 60px
        }
        
        /* 中心 */
        .center{
            position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:500px;height:500px;border-radius:50%;
            background:rgba(255,255,255,0.02);
            border:2px solid var(--border-gold);
            display:flex;align-items:center;justify-content:center;
            z-index:10;
            box-shadow:0 0 120px rgba(201,162,39,0.18),inset 0 0 100px rgba(201,162,39,0.1)
        }
        .center img{
            width:450px;height:450px;
            object-fit:cover;
            border-radius:50%;
            clip-path:circle(50% at 50% 50%)
        }
        
        /* 奖项卡片 */
        .award{
            position:absolute;
            width:140px;padding:20px 16px;
            background:rgba(255,255,255,0.02);
            border:1px solid var(--border-gold);
            border-radius:14px;
            text-align:center;
            cursor:pointer;
            transition:all 0.35s ease
        }
        .award:hover{
            background:rgba(201,162,39,0.1);
            border-color:rgba(201,162,39,0.6);
            transform:scale(1.08)
        }
        .award h3{font-size:13px;font-weight:400;color:var(--text-dim);margin-bottom:8px;letter-spacing:1px}
        .award .num{
            font-family:'Playfair Display',serif;
            font-size:28px;font-weight:600;color:var(--gold)
        }
        
        /* Modal */
        .modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(15px);display:none;justify-content:center;align-items:center;z-index:1000}
        .modal.show{display:flex}
        .modal-content{background:#12121a;border:1px solid var(--border-gold);border-radius:20px;padding:32px;width:90%;max-width:520px;max-height:70vh;overflow-y:auto}
        .modal-content h2{color:var(--gold);margin-bottom:20px;font-size:18px;font-weight:400;letter-spacing:2px}
        .result-item{padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer}
        .result-item:hover .result-title{color:var(--gold)}
        .result-title{font-size:14px;color:#fff;margin-bottom:4px}
        .result-meta{font-size:12px;color:var(--text-dim)}
        .btn-close{width:100%;padding:12px;margin-top:16px;border-radius:10px;border:none;background:rgba(255,255,255,0.05);color:#fff;font-size:13px;cursor:pointer}
        .btn-close:hover{background:var(--gold);color:#0a0a0f}
        
        .footer{text-align:center;padding:30px;color:var(--text-dim);font-size:12px}
        
        @media (max-width: 900px) {
            .header{padding:16px 30px;flex-wrap:wrap;gap:16px;justify-content:center}
            .ring-container{transform:scale(0.7)}
            .stats{gap:80px}
            .stat-value{font-size:56px}
        }
        @media (max-width: 600px) {
            .header{flex-direction:column}
            .ring-container{transform:scale(0.5)}
            .stats{flex-direction:column;gap:40px}
        }
    </style>
    <script src="js/particles.js"></script>
</head>
<body>
    <div class="bg"></div>
    
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🏆</div>
            <div class="logo-text">雅昌</div>
        </div>
        <div class="header-right">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索获奖产品..." onkeyup="handleSearch(event)">
            </div>
            <button class="admin-btn" onclick="location.href='admin.html'">管理后台</button>
        </div>
    </div>
    
    <div class="main">
        <div class="title">
            <h1>雅昌艺术品印刷荣誉墙</h1>
            <p class="title-desc">雅昌长期深耕艺术书籍的设计与印制，成就了艺术领域众多的经典作品，获得国际国内印制大奖<span class="highlight">1230余项</span>，其中<span class="highlight">14本书籍</span>荣膺"世界最美的书"称号、<span class="highlight">157本书</span>被评为"中国最美的书"。</p>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">获奖总数</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="awardCount">-</div>
                <div class="stat-label">参与赛事</div>
            </div>
        </div>

        <div class="ring-container" id="ringContainer">
            <div class="center">
                <img src="center-logo.png" alt="雅昌">
            </div>
        </div>
    </div>
    
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h2>搜索结果</h2>
            <div id="searchResults"></div>
            <button class="btn-close" onclick="closeSearch()">关闭</button>
        </div>
    </div>

    <script>
        let awardsData = [];

        // 圆形排列 - 使用JavaScript精确计算位置
        function positionAwards() {
            const container = document.getElementById('ringContainer');
            const oldCards = container.querySelectorAll('.award');
            oldCards.forEach(c => c.remove());

            const centerX = 400;
            const centerY = 400;
            const radius = 380;

            // 计算总行数（第一行1个，其余每行2个）
            const totalRows = Math.ceil((awardsData.length + 1) / 2);
            // 顶部单独一行，剩余行均匀分布在下半圆
            const rowSpan = 180 / (totalRows - 1 || 1);

            awardsData.forEach((award, i) => {
                let angle;
                if (i === 0) {
                    // 最多：顶部
                    angle = 270;
                } else {
                    // 其余均匀铺满一圈，每格36°，从右上顺时针展开
                    const step = 360 / awardsData.length;
                    angle = (270 + i * step) % 360;
                }
                const rad = angle * Math.PI / 180;
                const x = centerX + radius * Math.cos(rad) - 70;
                const y = centerY + radius * Math.sin(rad) - 40;

                const card = document.createElement('div');
                card.className = 'award';
                card.style.left = x + 'px';
                card.style.top = y + 'px';
                card.innerHTML = '<h3>' + award.name + '</h3><div class="num" id="card-' + award.name + '">' + award.count + '</div>';
                card.onclick = () => goToAward(award.name);
                container.appendChild(card);
            });
        }

        async function loadData() {
            try {
                const [awardsRes, statsRes] = await Promise.all([fetch('/api/awards'), fetch('/api/stats')]);
                awardsData = (await awardsRes.json()).sort((a, b) => b.count - a.count);
                const stats = await statsRes.json();

                document.getElementById('totalCount').textContent = stats.total || 0;
                document.getElementById('awardCount').textContent = stats.awardCount || 0;

                // 动态创建奖项卡片
                positionAwards();
            } catch (e) { console.error(e); }
        }
        
        function goToAward(name) {
            window.location.href = 'award.html?award=' + encodeURIComponent(name);
        }
        
        async function handleSearch(e) { if (e.key === 'Enter') doSearch(); }
        
        async function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            try {
                const resp = await fetch('/api/search?q=' + encodeURIComponent(q));
                const results = await resp.json();
                const container = document.getElementById('searchResults');
                
                if (results.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:30px">未找到相关产品</p>';
                } else {
                    container.innerHTML = results.map(r => 
                        '<div class="result-item" onclick="viewProduct(' + r.id + ')">' +
                            '<div class="result-title">' + (r.product_name || '未知产品') + '</div>' +
                            '<div class="result-meta">' + r.name + ' · ' + (r.award_level || '无等级') + '</div>' +
                        '</div>'
                    ).join('');
                }
                document.getElementById('searchModal').classList.add('show');
            } catch (e) { console.error(e); }
        }
        
        function viewProduct(id) { closeSearch(); window.location.href = 'product.html?id=' + id; }
        function closeSearch() { document.getElementById('searchModal').classList.remove('show'); }
        
        positionAwards();
        loadData();
    </script>
</body>
</html>
