<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <script src="js/particles.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --gold:#c9a227;--gold-light:#e8d48b;--gold-dark:#8b7020;
            --bg-dark:#0a0a0f;--bg-card:#12121a;
            --border-gold:rgba(201,162,39,0.3);
            --text-dim:rgba(255,255,255,0.45);--text-light:rgba(255,255,255,0.85)
        }
        body{font-family:'Noto Serif SC','Playfair Display',serif;background:var(--bg-dark);color:#fff;min-height:100vh}
        .header{
            position:fixed;top:0;left:0;right:0;z-index:100;
            padding:20px 40px;display:flex;justify-content:space-between;align-items:center;
            background:linear-gradient(to bottom,rgba(10,10,15,0.98),transparent);
            border-bottom:1px solid var(--border-gold)
        }
        .header h1{font-size:20px;color:var(--gold);font-weight:600;letter-spacing:6px}
        .btn{
            padding:10px 24px;border-radius:25px;border:1px solid var(--border-gold);
            background:transparent;color:var(--text-light);font-size:13px;cursor:pointer;
            font-family:inherit;transition:all 0.3s
        }
        .btn:hover{background:var(--gold);color:var(--bg-dark);border-color:var(--gold)}
        .btn-primary{background:var(--gold);color:var(--bg-dark);border-color:var(--gold)}
        .btn-primary:hover{background:var(--gold-light);border-color:var(--gold-light)}
        .main{max-width:1400px;margin:0 auto;padding:100px 40px 60px}
        .stats-grid{
            display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:50px
        }
        .stat-card{
            background:var(--bg-card);border:1px solid var(--border-gold);
            border-radius:20px;padding:36px;text-align:center;transition:all 0.3s
        }
        .stat-card:hover{border-color:var(--gold);transform:translateY(-4px)}
        .stat-card .icon{font-size:32px;margin-bottom:12px}
        .stat-card .value{font-size:42px;font-weight:600;color:var(--gold);margin-bottom:8px}
        .stat-card .label{font-size:14px;color:var(--text-dim);letter-spacing:2px}
        .section{
            background:var(--bg-card);border:1px solid var(--border-gold);
            border-radius:20px;padding:32px;margin-bottom:30px
        }
        .section-header{
            display:flex;justify-content:space-between;align-items:center;
            margin-bottom:24px;padding-bottom:20px;
            border-bottom:1px solid rgba(255,255,255,0.05)
        }
        .section-title{font-size:18px;color:var(--gold);letter-spacing:3px;font-weight:400}
        .filter-bar{
            display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:24px
        }
        .filter-bar select,.filter-bar input{
            padding:10px 16px;border-radius:12px;
            border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.03);color:#fff;font-size:14px;
            font-family:inherit;min-width:180px
        }
        .filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:var(--gold)}
        .filter-bar select option{background:var(--bg-card)}
        .filter-bar input{min-width:240px}
        .filter-bar .search-btn{
            padding:10px 20px;border-radius:12px;border:1px solid var(--border-gold);
            background:transparent;color:var(--gold);font-size:13px;cursor:pointer;
            font-family:inherit;transition:all 0.3s
        }
        .filter-bar .search-btn:hover{background:rgba(201,162,39,0.1)}
        .table-wrapper{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,0.05)}
        table{width:100%;border-collapse:collapse}
        th,td{
            padding:14px 18px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.04);
            white-space:nowrap;font-size:14px
        }
        th{color:var(--text-dim);font-weight:400;font-size:12px;letter-spacing:1px;background:rgba(255,255,255,0.02)}
        td{color:var(--text-light)}
        tr:hover td{background:rgba(201,162,39,0.04)}
        tr:last-child td{border-bottom:none}
        tr td:first-child{color:var(--gold)}
        .action-btn{
            padding:6px 14px;border-radius:8px;border:1px solid var(--border-gold);
            background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;
            font-family:inherit;transition:all 0.3s;margin-right:6px
        }
        .action-btn:hover{background:rgba(201,162,39,0.1);color:var(--gold);border-color:var(--gold)}
        .action-btn.danger:hover{background:rgba(248,113,113,0.1);color:#f87171;border-color:#f87171}
        .pagination{display:flex;justify-content:center;gap:8px;margin-top:30px;flex-wrap:wrap}
        .pagination button{
            padding:8px 16px;border-radius:10px;border:1px solid var(--border-gold);
            background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;
            font-family:inherit;transition:all 0.3s
        }
        .pagination button:hover:not(:disabled){background:rgba(201,162,39,0.1);color:var(--gold)}
        .pagination button.active{background:var(--gold);color:var(--bg-dark);border-color:var(--gold)}
        .pagination button:disabled{opacity:0.3;cursor:not-allowed}
        .modal{
            position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(15px);
            display:none;justify-content:center;align-items:center;z-index:1000;padding:20px
        }
        .modal.show{display:flex}
        .modal-content{
            background:var(--bg-card);border:1px solid var(--border-gold);
            border-radius:24px;padding:40px;width:100%;max-width:640px;max-height:85vh;overflow-y:auto
        }
        .modal-header{
            display:flex;justify-content:space-between;align-items:center;
            margin-bottom:30px;padding-bottom:20px;
            border-bottom:1px solid rgba(255,255,255,0.05)
        }
        .modal-header h3{font-size:18px;color:var(--gold);font-weight:400;letter-spacing:2px}
        .modal-close{
            width:36px;height:36px;border-radius:50%;border:1px solid var(--border-gold);
            background:transparent;color:var(--text-dim);cursor:pointer;font-size:18px;
            display:flex;align-items:center;justify-content:center;
            transition:all 0.3s;font-family:inherit
        }
        .modal-close:hover{background:rgba(201,162,39,0.1);color:var(--gold);border-color:var(--gold)}
        .modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
        .form-group{margin-bottom:16px}
        .form-group.full{grid-column:1/-1}
        .form-group label{
            display:block;margin-bottom:6px;font-size:12px;color:var(--text-dim);letter-spacing:1px
        }
        .form-group input,.form-group select,.form-group textarea{
            width:100%;padding:12px 14px;border-radius:12px;
            border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.03);color:#fff;font-size:14px;
            font-family:inherit
        }
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
            outline:none;border-color:var(--gold)
        }
        .form-group select option{background:var(--bg-card)}
        .form-group textarea{min-height:80px;resize:vertical}
        .import-options{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .import-option{
            border:2px solid var(--border-gold);border-radius:20px;padding:40px 24px;
            text-align:center;cursor:pointer;transition:all 0.3s
        }
        .import-option:hover{border-color:var(--gold);background:rgba(201,162,39,0.05)}
        .import-option .icon{font-size:48px;margin-bottom:16px}
        .import-option h4{font-size:16px;color:var(--gold);margin-bottom:8px;font-weight:400;letter-spacing:2px}
        .import-option p{font-size:13px;color:var(--text-dim)}
        .upload-area{
            border:2px dashed var(--border-gold);border-radius:16px;
            padding:40px;text-align:center;cursor:pointer;transition:all 0.3s
        }
        .upload-area:hover{border-color:var(--gold);background:rgba(201,162,39,0.05)}
        .upload-area input{display:none}
        .upload-area .icon{font-size:36px;opacity:0.5;margin-bottom:12px}
        .upload-area p{color:var(--text-dim);font-size:14px}
        .upload-area .hint{color:rgba(255,255,255,0.3);font-size:12px;margin-top:6px}
        .upload-status{margin-top:16px;font-size:14px}
        .upload-status.success{color:#4ade80}
        .upload-status.error{color:#f87171}
        .loading{text-align:center;padding:60px;color:var(--text-dim)}
        .empty{text-align:center;padding:40px;color:var(--text-dim)}
        @media(max-width:768px){
            .header{flex-direction:column;gap:16px;padding:15px 20px}
            .main{padding:80px 20px 40px}
            .stats-grid{grid-template-columns:1fr}
            .filter-bar{flex-direction:column}
            .filter-bar select,.filter-bar input,.filter-bar .search-btn{width:100%}
            .form-row{grid-template-columns:1fr}
            .import-options{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ARTRON</h1>
        <button class="btn" onclick="window.open('index.html', '_blank')">查看前台</button>
        <button class="btn" onclick="logout()">退出登录</button>
    </div>

    <div class="main">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">🏆</div>
                <div class="value" id="totalCount">-</div>
                <div class="label">总记录数</div>
            </div>
            <div class="stat-card">
                <div class="icon">📋</div>
                <div class="value" id="awardCount">-</div>
                <div class="label">奖项类别</div>
            </div>
            <div class="stat-card">
                <div class="icon">🏢</div>
                <div class="value" id="regionCount">-</div>
                <div class="label">获奖单位</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-title">数据管理</div>
                <button class="btn btn-primary" onclick="showAddModal()">+ 新增记录</button>
            </div>

            <div class="filter-bar">
                <select id="filterAward" onchange="onAwardChange()">
                    <option value="">全部奖项</option>
                </select>
                <select id="filterYear" onchange="onFilterChange()">
                    <option value="">全部年度</option>
                </select>
                <input type="text" id="filterSearch" placeholder="搜索产品名称..." onkeyup="if(event.key==='Enter')onFilterChange()">
                <button class="search-btn" onclick="onFilterChange()">🔍 搜索</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新增记录</h3>
                <button class="modal-close" onclick="closeAddModal()">×</button>
            </div>
            <div class="import-options" id="importOptions">
                <div class="import-option" onclick="showBatchImport()">
                    <div class="icon">📁</div>
                    <h4>批量导入</h4>
                    <p>上传 Excel 文件批量导入数据</p>
                </div>
                <div class="import-option" onclick="showManualImport()">
                    <div class="icon">✏️</div>
                    <h4>手工导入</h4>
                    <p>手动填写表单添加单条记录</p>
                </div>
            </div>
            <div id="batchImportArea" style="display:none">
                <div class="form-group">
                    <label>奖项类别</label>
                    <select id="importAward"></select>
                </div>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept=".xls,.xlsx" onchange="handleFile(this.files[0])">
                    <div class="icon">📤</div>
                    <p>点击选择 Excel 文件</p>
                    <p class="hint">支持 .xls 和 .xlsx 格式</p>
                </div>
                <div id="uploadStatus" class="upload-status"></div>
                <div class="modal-actions">
                    <button class="btn" onclick="backToOptions()">← 返回</button>
                </div>
            </div>
            <div id="manualFormArea" style="display:none">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>奖项名称 *</label>
                            <select id="editName" required></select>
                        </div>
                        <div class="form-group">
                            <label>年份</label>
                            <input type="text" id="editYear" placeholder="如：2023年">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>产品名称 *</label>
                            <input type="text" id="editProductName" required>
                        </div>
                        <div class="form-group">
                            <label>获奖单位</label>
                            <input type="text" id="editRegion">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>获奖等级</label>
                            <input type="text" id="editAwardLevel">
                        </div>
                        <div class="form-group">
                            <label>奖项分类</label>
                            <input type="text" id="editAwardCategory">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>摄影/产品类型</label>
                            <input type="text" id="editPhotographyType">
                        </div>
                        <div class="form-group">
                            <label>装订方式</label>
                            <input type="text" id="editBinding">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>出版社</label>
                            <input type="text" id="editPublisher">
                        </div>
                        <div class="form-group">
                            <label>作品图片（可上传多张）</label>
                            <input type="file" id="editImageFile" accept="image/*" multiple onchange="handleImageFiles(this)" style="display:none">
                            <div class="upload-area" style="padding:20px" onclick="document.getElementById('editImageFile').click()">
                                <div class="icon">🖼️</div>
                                <p id="imageUploadText">点击或拖拽添加图片（支持多张）</p>
                                <p class="hint">已选择 <span id="imageCount">0</span> 张</p>
                            </div>
                            <div id="imagePreviewList" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px"></div>
                        </div>
                    </div>
                    <div class="form-group full">
                        <label>设计/工艺特点</label>
                        <textarea id="editFeatures" rows="3"></textarea>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn" onclick="backToOptions()">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 20;
        // imageDataUrls: current list of base64 data URLs
        let imageDataUrls = [];
        // pendingFiles: newly selected File objects awaiting conversion
        let pendingFiles = [];

        function authHeaders() {
            const token = localStorage.getItem('auth_token');
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        async function checkAuth() {
            const resp = await fetch('/api/auth/check', { headers: authHeaders() });
            const data = await resp.json();
            if (!data.authenticated) window.location.href = 'login.html';
        }

        async function loadStats() {
            const resp = await fetch('/api/stats');
            const stats = await resp.json();
            document.getElementById('totalCount').textContent = stats.total || 0;
            document.getElementById('awardCount').textContent = stats.awardCount || 0;
            document.getElementById('regionCount').textContent = stats.regionCount || 0;
        }

        async function loadAwardOptions() {
            const resp = await fetch('/api/award-options', { headers: authHeaders() });
            const awards = await resp.json();
            const options = awards.map(a => '<option value="' + a + '">' + a + '</option>').join('');
            document.getElementById('filterAward').innerHTML = '<option value="">全部奖项</option>' + options;
            document.getElementById('importAward').innerHTML = options;
            document.getElementById('editName').innerHTML = options;
        }

        async function onAwardChange() {
            const award = document.getElementById('filterAward').value;
            const yearSelect = document.getElementById('filterYear');
            yearSelect.innerHTML = '<option value="">全部年度</option>';
            if (award) {
                try {
                    const resp = await fetch('/api/years/' + encodeURIComponent(award), { headers: authHeaders() });
                    const years = await resp.json();
                    years.forEach(y => {
                        yearSelect.innerHTML += '<option value="' + y + '">' + y + '</option>';
                    });
                } catch (e) { console.error(e); }
            }
            currentPage = 1;
            loadProducts();
        }

        function onFilterChange() {
            currentPage = 1;
            loadProducts();
        }

        async function loadProducts() {
            const award = document.getElementById('filterAward').value;
            const year = document.getElementById('filterYear').value;
            const search = document.getElementById('filterSearch').value;
            try {
                let url = '/api/admin/products?page=' + currentPage + '&limit=' + pageSize;
                if (award) url += '&award=' + encodeURIComponent(award);
                if (year) url += '&year=' + encodeURIComponent(year);
                if (search) url += '&search=' + encodeURIComponent(search);
                const resp = await fetch(url, { headers: authHeaders() });
                const data = await resp.json();
                renderTable(data.items);
                renderPagination(data.totalPages);
            } catch (e) {
                console.error(e);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty">加载失败</td></tr>';
            }
        }

        function renderTable(items) {
            document.getElementById('tableHead').innerHTML = '<tr><th>ID</th><th>奖项</th><th>产品名称</th><th>年度</th><th>获奖单位</th><th>等级</th><th>操作</th></tr>';
            if (!items || items.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
                return;
            }
            document.getElementById('tableBody').innerHTML = items.map(p =>
                '<tr><td>' + p.id + '</td><td>' + (p.name || '-') + '</td><td>' + (p.product_name || '-') + '</td><td>' + (p.year || '-') + '</td><td>' + (p.region || '-') + '</td><td>' + (p.award_level || '-') + '</td><td><button class="action-btn" onclick="editProduct(' + p.id + ')">编辑</button><button class="action-btn danger" onclick="deleteProduct(' + p.id + ')">删除</button></td></tr>'
            ).join('');
        }

        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            if (totalPages <= 1) { pagination.innerHTML = ''; return; }
            let html = '<button onclick="changePage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>';
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += '<button onclick="changePage(' + i + ')" class="' + (i === currentPage ? 'active' : '') + '">' + i + '</button>';
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<span style="color:#666">...</span>';
                }
            }
            html += '<button onclick="changePage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
            pagination.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil((document.getElementById('totalCount').textContent || 1) / pageSize) || 1;
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadProducts();
        }

        async function handleFile(file) {
            if (!file) return;
            const award = document.getElementById('importAward').value;
            if (!award) {
                document.getElementById('uploadStatus').innerHTML = '<span class="error">请先选择奖项类别</span>';
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            formData.append('award', award);
            document.getElementById('uploadStatus').innerHTML = '<span style="color:var(--text-dim)">正在导入...</span>';
            try {
                const resp = await fetch('/api/upload', { method: 'POST', body: formData, headers: authHeaders() });
                const data = await resp.json();
                if (resp.ok) {
                    document.getElementById('uploadStatus').innerHTML = '<span class="success">成功导入 ' + data.imported + ' 条记录</span>';
                    loadStats();
                    loadProducts();
                } else {
                    document.getElementById('uploadStatus').innerHTML = '<span class="error">导入失败: ' + (data.error || '') + '</span>';
                }
            } catch (e) {
                document.getElementById('uploadStatus').innerHTML = '<span class="error">导入失败: ' + e.message + '</span>';
            }
        }

        async function editProduct(id) {
            const resp = await fetch('/api/products/' + id);
            const p = await resp.json();
            document.getElementById('addModal').classList.add('show');
            document.getElementById('importOptions').style.display = 'none';
            document.getElementById('batchImportArea').style.display = 'none';
            document.getElementById('manualFormArea').style.display = 'block';
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = p.name || '';
            document.getElementById('editYear').value = p.year || '';
            document.getElementById('editProductName').value = p.product_name || '';
            document.getElementById('editRegion').value = p.region || '';
            document.getElementById('editAwardLevel').value = p.award_level || '';
            document.getElementById('editAwardCategory').value = p.award_category || '';
            document.getElementById('editPhotographyType').value = p.photography_type || '';
            document.getElementById('editBinding').value = p.binding || '';
            document.getElementById('editPublisher').value = p.publisher || '';
            document.getElementById('editFeatures').value = p.features || '';
            // Load existing images (support both old single-url and new JSON-array format)
            try {
                imageDataUrls = JSON.parse(p.image_url || '[]');
            } catch {
                imageDataUrls = p.image_url ? [p.image_url] : [];
            }
            pendingFiles = [];
            renderImagePreviews();
        }

        async function deleteProduct(id) {
            if (!confirm('确定要删除这条记录吗？')) return;
            try {
                const resp = await fetch('/api/admin/products/' + id, { method: 'DELETE', headers: authHeaders() });
                if (resp.ok) { loadProducts(); loadStats(); }
            } catch (e) { alert('删除失败'); }
        }

        function showAddModal() {
            document.getElementById('addModal').classList.add('show');
            document.getElementById('importOptions').style.display = 'grid';
            document.getElementById('batchImportArea').style.display = 'none';
            document.getElementById('manualFormArea').style.display = 'none';
            document.getElementById('editForm').reset();
            document.getElementById('editId').value = '';
            imageDataUrls = [];
            pendingFiles = [];
            renderImagePreviews();
        }

        function showBatchImport() {
            document.getElementById('importOptions').style.display = 'none';
            document.getElementById('batchImportArea').style.display = 'block';
            document.getElementById('manualFormArea').style.display = 'none';
            document.getElementById('uploadStatus').innerHTML = '';
        }

        function showManualImport() {
            document.getElementById('importOptions').style.display = 'none';
            document.getElementById('batchImportArea').style.display = 'none';
            document.getElementById('manualFormArea').style.display = 'block';
            document.getElementById('editId').value = '';
            imageDataUrls = [];
            pendingFiles = [];
            renderImagePreviews();
        }



        // Render thumbnail grid for current images
        function renderImagePreviews() {
            const list = document.getElementById('imagePreviewList');
            const count = document.getElementById('imageCount');
            if (!list) return;
            count.textContent = imageDataUrls.length + pendingFiles.length;
            list.innerHTML = '';
            imageDataUrls.forEach(function(url, i) {
                list.innerHTML += '<div style="position:relative;display:inline-block"><img src="' + url + '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid rgba(201,162,39,0.3)"><button type="button" onclick="removeImage(' + i + ')" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#e94560;color:#fff;font-size:14px;line-height:1;cursor:pointer">×</button></div>';
            });
            pendingFiles.forEach(function(file, i) {
                list.innerHTML += '<div style="position:relative;display:inline-block;opacity:0.6"><img src="" id="pending-preview-' + i + '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid rgba(201,162,39,0.3)"><span style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.6);color:#fff;font-size:10px;padding:1px 4px;border-radius:4px">等待...</span><button type="button" onclick="removePendingFile(' + i + ')" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#e94560;color:#fff;font-size:14px;line-height:1;cursor:pointer">×</button></div>';
            });
        }

        function removeImage(index) {
            imageDataUrls.splice(index, 1);
            renderImagePreviews();
        }

        function removePendingFile(index) {
            pendingFiles.splice(index, 1);
            renderImagePreviews();
        }

        // Handle multiple file selection
        function handleImageFiles(input) {
            if (!input.files) return;
            Array.from(input.files).forEach(function(file) {
                pendingFiles.push(file);
                var idx = pendingFiles.length - 1;
                var reader = new FileReader();
                reader.onload = function(e) {
                    var el = document.getElementById('pending-preview-' + idx);
                    if (el) el.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            input.value = '';
            renderImagePreviews();
        }

        function backToOptions() {
            document.getElementById('importOptions').style.display = 'grid';
            document.getElementById('batchImportArea').style.display = 'none';
            document.getElementById('manualFormArea').style.display = 'none';
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
            backToOptions();
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = e.target.querySelector('[type="submit"]');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            try {
                // Convert any newly selected files to data URLs before submitting
                for (const file of pendingFiles) {
                    const dataUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                    imageDataUrls.push(dataUrl);
                }
                pendingFiles = [];

                const id = document.getElementById('editId').value;
                const data = {
                    name: document.getElementById('editName').value,
                    year: document.getElementById('editYear').value,
                    region: document.getElementById('editRegion').value,
                    product_name: document.getElementById('editProductName').value,
                    award_level: document.getElementById('editAwardLevel').value,
                    award_category: document.getElementById('editAwardCategory').value,
                    photography_type: document.getElementById('editPhotographyType').value,
                    binding: document.getElementById('editBinding').value,
                    publisher: document.getElementById('editPublisher').value,
                    images: imageDataUrls,
                    features: document.getElementById('editFeatures').value
                };
                const url = id ? '/api/admin/products/' + id : '/api/admin/products';
                const method = id ? 'PUT' : 'POST';
                const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify(data) });
                if (resp.ok) {
                    closeAddModal();
                    loadProducts();
                    loadStats();
                } else {
                    const err = await resp.json();
                    alert('保存失败: ' + (err.error || '未知错误'));
                }
            } catch (e) {
                alert('保存失败: ' + e.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存';
            }
        };

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST', headers: authHeaders() });
            localStorage.removeItem('auth_token');
            window.location.href = 'login.html';
        }

        checkAuth();
        loadStats();
        loadAwardOptions();
        loadProducts();
    </script>
</body>
</html>
