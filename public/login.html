<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <script src="js/particles.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --gold:#c9a227;
            --gold-light:#e8d48b;
            --bg-dark:#0a0a0f;
            --bg-card:#12121a;
            --border-gold:rgba(201,162,39,0.3);
            --text-dim:rgba(255,255,255,0.45);
            --text-light:rgba(255,255,255,0.85)
        }
        body{
            font-family:'Noto Serif SC','Playfair Display',serif;
            background:var(--bg-dark);
            color:#fff;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center
        }

        .login-box{
            background:var(--bg-card);
            border:1px solid var(--border-gold);
            border-radius:24px;
            padding:50px 50px 40px;
            width:100%;
            max-width:440px;
            text-align:center
        }

        .login-icon{
            width:70px;height:70px;
            background:linear-gradient(135deg,var(--gold),var(--gold-light));
            border-radius:20px;
            display:flex;align-items:center;justify-content:center;
            margin:0 auto 24px;
            font-size:32px
        }

        .login-box h1{
            font-size:24px;color:var(--gold);
            font-weight:600;letter-spacing:6px;
            margin-bottom:8px
        }

        .login-box .subtitle{
            color:var(--text-dim);font-size:14px;
            margin-bottom:40px;letter-spacing:2px
        }

        .form-group{
            margin-bottom:20px;text-align:left
        }
        .form-group label{
            display:block;margin-bottom:8px;
            font-size:13px;color:var(--text-dim);letter-spacing:1px
        }
        .form-group input{
            width:100%;padding:14px 18px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.1);
            background:rgba(255,255,255,0.03);
            color:#fff;font-size:15px;
            font-family:inherit;
            transition:border-color 0.3s
        }
        .form-group input:focus{
            outline:none;border-color:var(--gold)
        }
        .form-group input::placeholder{color:var(--text-dim)}

        .btn{
            width:100%;padding:16px;
            border-radius:14px;border:none;
            background:linear-gradient(135deg,var(--gold),var(--gold-dark));
            color:var(--bg-dark);font-size:15px;
            font-family:inherit;font-weight:600;
            letter-spacing:4px;cursor:pointer;
            transition:all 0.3s;
            margin-top:10px
        }
        .btn:hover{
            background:linear-gradient(135deg,var(--gold-light),var(--gold));
            transform:translateY(-2px)
        }
        .btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}

        .error-msg{
            color:#f87171;font-size:13px;
            margin-top:16px;display:none
        }
        .error-msg.show{display:block}
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-icon">🏆</div>
        <h1>ARTRON</h1>
        <p class="subtitle">数据管理后台</p>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">登 录</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('errorMsg');
            btn.disabled = true;
            btn.textContent = '登录中...';
            error.classList.remove('show');

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            }).then(r => r.json()).then(data => {
                if (data.success && data.token) {
                    localStorage.setItem('auth_token', data.token);
                    window.location.href = 'admin.html';
                } else {
                    error.textContent = data.message || data.error || '用户名或密码错误';
                    error.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            }).catch(() => {
                error.textContent = '登录失败，请重试';
                error.classList.add('show');
                btn.disabled = false;
                btn.textContent = '登 录';
            });
        }
    </script>
</body>
</html>
